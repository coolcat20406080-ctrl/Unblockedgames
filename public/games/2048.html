<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 380px;
      margin-bottom: 16px;
    }
    .title {
      font-size: 32px;
      font-weight: 800;
      color: #fbbf24;
      letter-spacing: -1px;
    }
    .scores {
      display: flex;
      gap: 8px;
    }
    .score-box {
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #334155;
      min-width: 70px;
    }
    .score-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
    }
    .score-val {
      font-size: 16px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .grid-container {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      position: relative;
      touch-action: none;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 72px);
      grid-template-rows: repeat(4, 72px);
      gap: 10px;
    }
    .cell {
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      transition: transform 0.1s ease, background 0.1s ease;
    }
    .t-2 { background: #334155; color: #f8fafc; }
    .t-4 { background: #475569; color: #f8fafc; }
    .t-8 { background: #f59e0b; color: #fff; }
    .t-16 { background: #d97706; color: #fff; }
    .t-32 { background: #ea580c; color: #fff; }
    .t-64 { background: #dc2626; color: #fff; }
    .t-128 { background: #eab308; color: #000; font-size: 20px; }
    .t-256 { background: #facc15; color: #000; font-size: 20px; }
    .t-512 { background: #10b981; color: #fff; font-size: 20px; }
    .t-1024 { background: #06b6d4; color: #fff; font-size: 16px; }
    .t-2048 { background: #8b5cf6; color: #fff; font-size: 16px; box-shadow: 0 0 12px #8b5cf6; }

    .actions {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 380px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid #475569;
      padding: 10px 0;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #334155; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">Score</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">Best</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="grid-container" id="touch-area">
    <div class="grid" id="grid"></div>
    <div class="overlay" id="game-over-overlay">
      <h2 style="font-size: 26px; font-weight: 800;">Game Over!</h2>
      <button id="retry-btn" style="max-width: 140px; background: #2563eb; border-color: #3b82f6;">Try Again</button>
    </div>
  </div>

  <div class="actions">
    <button id="new-game-btn">New Game (R)</button>
    <button id="undo-btn">Undo Move</button>
  </div>

  <script>
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('game-over-overlay');
    const newGameBtn = document.getElementById('new-game-btn');
    const retryBtn = document.getElementById('retry-btn');
    const undoBtn = document.getElementById('undo-btn');

    let board = [];
    let prevBoard = null;
    let score = 0;
    let prevScore = 0;
    let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    bestEl.textContent = best;

    function init() {
      board = Array(4).fill(0).map(() => Array(4).fill(0));
      score = 0;
      prevBoard = null;
      overlay.classList.remove('show');
      scoreEl.textContent = '0';
      spawnTile();
      spawnTile();
      render();
    }

    function spawnTile() {
      const empties = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) empties.push({r, c});
        }
      }
      if (empties.length > 0) {
        const spot = empties[Math.floor(Math.random() * empties.length)];
        board[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      gridEl.innerHTML = '';
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          const cell = document.createElement('div');
          cell.className = 'cell' + (val > 0 ? ` t-${Math.min(val, 2048)}` : '');
          cell.textContent = val > 0 ? val : '';
          gridEl.appendChild(cell);
        }
      }
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('2048_best', best);
      }
    }

    function slideRow(row) {
      let filtered = row.filter(x => x !== 0);
      let gained = 0;
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          gained += filtered[i];
          filtered.splice(i + 1, 1);
        }
      }
      while (filtered.length < 4) filtered.push(0);
      return {row: filtered, gained};
    }

    function rotateBoard() {
      const newBoard = Array(4).fill(0).map(() => Array(4).fill(0));
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          newBoard[c][3 - r] = board[r][c];
        }
      }
      board = newBoard;
    }

    function moveLeft() {
      let moved = false;
      let totalGained = 0;
      for (let r = 0; r < 4; r++) {
        const {row, gained} = slideRow(board[r]);
        totalGained += gained;
        if (row.some((val, idx) => val !== board[r][idx])) moved = true;
        board[r] = row;
      }
      if (moved) score += totalGained;
      return moved;
    }

    function move(dir) {
      prevBoard = board.map(row => [...row]);
      prevScore = score;
      let moved = false;

      if (dir === 'left') {
        moved = moveLeft();
      } else if (dir === 'down') {
        rotateBoard();
        moved = moveLeft();
        rotateBoard(); rotateBoard(); rotateBoard();
      } else if (dir === 'right') {
        rotateBoard(); rotateBoard();
        moved = moveLeft();
        rotateBoard(); rotateBoard();
      } else if (dir === 'up') {
        rotateBoard(); rotateBoard(); rotateBoard();
        moved = moveLeft();
        rotateBoard();
      }

      if (moved) {
        spawnTile();
        render();
        if (checkGameOver()) {
          overlay.classList.add('show');
        }
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) return false;
          if (c < 3 && board[r][c] === board[r][c + 1]) return false;
          if (r < 3 && board[r][c] === board[r + 1][c]) return false;
        }
      }
      return true;
    }

    function undo() {
      if (prevBoard) {
        board = prevBoard;
        score = prevScore;
        prevBoard = null;
        overlay.classList.remove('show');
        render();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') move('left');
      else if (e.key === 'ArrowRight' || e.key === 'd') move('right');
      else if (e.key === 'ArrowUp' || e.key === 'w') move('up');
      else if (e.key === 'ArrowDown' || e.key === 's') move('down');
      else if (e.key === 'r' || e.key === 'R') init();
    });

    // Touch support
    let touchStartX = 0, touchStartY = 0;
    const touchArea = document.getElementById('touch-area');
    touchArea.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, {passive: true});

    touchArea.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        move(dx > 0 ? 'right' : 'left');
      } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 30) {
        move(dy > 0 ? 'down' : 'up');
      }
    }, {passive: true});

    newGameBtn.addEventListener('click', init);
    retryBtn.addEventListener('click', init);
    undoBtn.addEventListener('click', undo);

    init();
  </script>
</body>
</html>
