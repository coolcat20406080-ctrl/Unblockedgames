<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .stat-badge {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .accent { color: #10b981; }
    canvas {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      max-width: 100%;
      max-height: 70vh;
      touch-action: none;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    button {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }
    button:hover { background: #334155; border-color: #64748b; }
    .touch-dpad {
      display: none;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
      margin-top: 12px;
    }
    @media (pointer: coarse) {
      .touch-dpad { display: grid; }
    }
    .d-btn {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="stat-badge">SCORE: <span id="score" class="accent">0</span></div>
    <div class="stat-badge">BEST: <span id="best">0</span></div>
    <div class="stat-badge">SPEED: <span id="speed-label">NORMAL</span></div>
  </div>

  <canvas id="game" width="400" height="400"></canvas>

  <div class="controls">
    <button id="pause-btn">Pause (Space)</button>
    <button id="restart-btn">Restart (R)</button>
    <button id="speed-btn">Toggle Speed</button>
  </div>

  <div class="touch-dpad">
    <div></div>
    <button class="d-btn" id="d-up">▲</button>
    <div></div>
    <button class="d-btn" id="d-left">◀</button>
    <div></div>
    <button class="d-btn" id="d-right">▶</button>
    <div></div>
    <button class="d-btn" id="d-down">▼</button>
    <div></div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const speedEl = document.getElementById('speed-label');
    const pauseBtn = document.getElementById('pause-btn');
    const restartBtn = document.getElementById('restart-btn');
    const speedBtn = document.getElementById('speed-btn');

    const GRID = 20;
    const TILES = canvas.width / GRID;

    let snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    let dir = {x: 1, y: 0};
    let nextDir = {x: 1, y: 0};
    let food = {x: 15, y: 10};
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0', 10);
    bestEl.textContent = best;
    let gameOver = false;
    let paused = false;
    let speeds = [100, 75, 50];
    let speedNames = ['NORMAL', 'FAST', 'LUDICROUS'];
    let speedIdx = 0;
    let gameLoop = null;

    // Web Audio synthesizer
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq, type, duration) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function placeFood() {
      let valid = false;
      while (!valid) {
        food = {
          x: Math.floor(Math.random() * TILES),
          y: Math.floor(Math.random() * TILES)
        };
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function resetGame() {
      snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
      dir = {x: 1, y: 0};
      nextDir = {x: 1, y: 0};
      score = 0;
      scoreEl.textContent = '0';
      gameOver = false;
      paused = false;
      pauseBtn.textContent = 'Pause (Space)';
      placeFood();
      startLoop();
    }

    function step() {
      if (gameOver || paused) return;

      dir = nextDir;
      const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

      // Wall collision
      if (head.x < 0 || head.x >= TILES || head.y < 0 || head.y >= TILES) {
        endGame();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        endGame();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem('snake_best', best);
        }
        playBeep(587.33, 'triangle', 0.1);
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Background grid
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1;
      for (let i = 0; i < TILES; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID, 0);
        ctx.lineTo(i * GRID, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID);
        ctx.lineTo(canvas.width, i * GRID);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ef4444';
      ctx.shadowColor = '#ef4444';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake body
      snake.forEach((seg, i) => {
        if (i === 0) {
          ctx.fillStyle = '#10b981';
          ctx.shadowColor = '#10b981';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = `hsl(${155 - i * 2}, 70%, ${55 - Math.min(i, 20)}%)`;
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
      });

      if (gameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '14px system-ui';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Press R or Restart Button to Play Again', canvas.width / 2, canvas.height / 2 + 20);
      } else if (paused) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 22px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
      }
    }

    function endGame() {
      gameOver = true;
      playBeep(180, 'sawtooth', 0.3);
      draw();
    }

    function startLoop() {
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(step, speeds[speedIdx]);
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        if (dir.y !== 1) nextDir = {x: 0, y: -1};
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        if (dir.y !== -1) nextDir = {x: 0, y: 1};
      } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        if (dir.x !== 1) nextDir = {x: -1, y: 0};
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        if (dir.x !== -1) nextDir = {x: 1, y: 0};
      } else if (e.code === 'Space') {
        e.preventDefault();
        togglePause();
      } else if (e.key === 'r' || e.key === 'R') {
        resetGame();
      }
    });

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? 'Resume (Space)' : 'Pause (Space)';
      draw();
    }

    pauseBtn.addEventListener('click', togglePause);
    restartBtn.addEventListener('click', resetGame);
    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      speedEl.textContent = speedNames[speedIdx];
      startLoop();
    });

    document.getElementById('d-up').addEventListener('click', () => { if (dir.y !== 1) nextDir = {x: 0, y: -1}; });
    document.getElementById('d-down').addEventListener('click', () => { if (dir.y !== -1) nextDir = {x: 0, y: 1}; });
    document.getElementById('d-left').addEventListener('click', () => { if (dir.x !== 1) nextDir = {x: -1, y: 0}; });
    document.getElementById('d-right').addEventListener('click', () => { if (dir.x !== -1) nextDir = {x: 1, y: 0}; });

    resetGame();
  </script>
</body>
</html>
