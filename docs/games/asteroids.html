<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Asteroids Vector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #050811;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 700;
    }
    .badge {
      background: #111827;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #1f2937;
    }
    canvas {
      background: #020617;
      border: 2px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      max-width: 100%;
    }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      background: #1f2937;
      color: #f8fafc;
      border: 1px solid #374151;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #374151; }
  </style>
</head>
<body>
  <div class="hud">
    <div class="badge">SCORE: <span id="score" style="color:#38bdf8;">0</span></div>
    <div class="badge">SHIPS: <span id="lives" style="color:#10b981;">▲▲▲</span></div>
  </div>

  <canvas id="game" width="500" height="420"></canvas>

  <div class="controls">
    <button id="restart-btn">Restart (R)</button>
    <button id="thrust-hint">Controls: Arrows/WASD + Space</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const restartBtn = document.getElementById('restart-btn');

    let ship = { x: 250, y: 210, r: 12, rot: -Math.PI / 2, vx: 0, vy: 0, thrust: false };
    let lasers = [];
    let asteroids = [];
    let particles = [];
    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let keys = {};

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, type='sine', dur=0.08, vol=0.04) {
      if (audio.state === 'suspended') audio.resume();
      try {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audio.currentTime);
        g.gain.setValueAtTime(vol, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
        o.connect(g);
        g.connect(audio.destination);
        o.start();
        o.stop(audio.currentTime + dur);
      } catch(e) {}
    }

    function createAsteroid(x, y, tier = 3) {
      const r = tier === 3 ? 36 : (tier === 2 ? 22 : 12);
      const angle = Math.random() * Math.PI * 2;
      const speed = (4 - tier) * 0.8 + Math.random() * 0.5;
      const verts = Math.floor(Math.random() * 4) + 8;
      const offsets = [];
      for (let i = 0; i < verts; i++) offsets.push(0.8 + Math.random() * 0.4);

      return {
        x: x !== undefined ? x : (Math.random() < 0.5 ? 0 : canvas.width),
        y: y !== undefined ? y : (Math.random() < 0.5 ? 0 : canvas.height),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r,
        tier,
        rot: 0,
        rotSpeed: (Math.random() - 0.5) * 0.04,
        verts,
        offsets
      };
    }

    function spawnInitialAsteroids() {
      asteroids = [];
      for (let i = 0; i < 4; i++) {
        asteroids.push(createAsteroid());
      }
    }

    function shoot() {
      if (lasers.length < 5 && !isGameOver) {
        lasers.push({
          x: ship.x + Math.cos(ship.rot) * ship.r,
          y: ship.y + Math.sin(ship.rot) * ship.r,
          vx: Math.cos(ship.rot) * 8 + ship.vx,
          vy: Math.sin(ship.rot) * 8 + ship.vy,
          life: 45
        });
        beep(800, 'triangle', 0.05);
      }
    }

    function explode(x, y, count=12) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd,
          life: 1
        });
      }
    }

    function resetShip() {
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.vx = 0;
      ship.vy = 0;
      ship.rot = -Math.PI / 2;
    }

    function resetGame() {
      score = 0;
      lives = 3;
      isGameOver = false;
      lasers = [];
      particles = [];
      scoreEl.textContent = '0';
      livesEl.textContent = '▲▲▲';
      resetShip();
      spawnInitialAsteroids();
    }

    function update() {
      if (!isGameOver) {
        // Controls
        if (keys['ArrowLeft'] || keys['a']) ship.rot -= 0.07;
        if (keys['ArrowRight'] || keys['d']) ship.rot += 0.07;
        ship.thrust = keys['ArrowUp'] || keys['w'];

        if (ship.thrust) {
          ship.vx += Math.cos(ship.rot) * 0.12;
          ship.vy += Math.sin(ship.rot) * 0.12;
        }

        // Friction
        ship.vx *= 0.985;
        ship.vy *= 0.985;

        ship.x = (ship.x + ship.vx + canvas.width) % canvas.width;
        ship.y = (ship.y + ship.vy + canvas.height) % canvas.height;

        // Lasers
        lasers.forEach(l => {
          l.x = (l.x + l.vx + canvas.width) % canvas.width;
          l.y = (l.y + l.vy + canvas.height) % canvas.height;
          l.life--;
        });
        lasers = lasers.filter(l => l.life > 0);

        // Asteroids
        asteroids.forEach(a => {
          a.x = (a.x + a.vx + canvas.width) % canvas.width;
          a.y = (a.y + a.vy + canvas.height) % canvas.height;
          a.rot += a.rotSpeed;

          // Check hit player
          const distShip = Math.hypot(ship.x - a.x, ship.y - a.y);
          if (distShip < ship.r + a.r) {
            explode(ship.x, ship.y, 25);
            lives--;
            livesEl.textContent = '▲'.repeat(Math.max(0, lives));
            beep(140, 'sawtooth', 0.3);
            if (lives <= 0) {
              isGameOver = true;
            } else {
              resetShip();
            }
          }
        });

        // Laser - Asteroid collisions
        lasers.forEach(l => {
          asteroids.forEach((a, aIdx) => {
            const dist = Math.hypot(l.x - a.x, l.y - a.y);
            if (dist < a.r) {
              l.life = 0;
              explode(a.x, a.y, 14);
              score += (4 - a.tier) * 50;
              scoreEl.textContent = score;
              beep(300 + (4 - a.tier) * 100, 'square', 0.08);

              if (a.tier > 1) {
                asteroids.push(createAsteroid(a.x, a.y, a.tier - 1));
                asteroids.push(createAsteroid(a.x, a.y, a.tier - 1));
              }
              asteroids.splice(aIdx, 1);
            }
          });
        });

        if (asteroids.length === 0) {
          spawnInitialAsteroids();
        }

        // Particles
        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.02;
        });
        particles = particles.filter(p => p.life > 0);
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Ship
      if (!isGameOver) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.rot);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ship.r, 0);
        ctx.lineTo(-ship.r * 0.8, ship.r * 0.7);
        ctx.lineTo(-ship.r * 0.4, 0);
        ctx.lineTo(-ship.r * 0.8, -ship.r * 0.7);
        ctx.closePath();
        ctx.stroke();

        // Thrust flame
        if (ship.thrust) {
          ctx.strokeStyle = '#f97316';
          ctx.beginPath();
          ctx.moveTo(-ship.r * 0.4, 0);
          ctx.lineTo(-ship.r * 1.2, 0);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Draw Lasers
      ctx.fillStyle = '#38bdf8';
      lasers.forEach(l => {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2.5, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Asteroids
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1.8;
      asteroids.forEach(a => {
        ctx.save();
        ctx.translate(a.x, a.y);
        ctx.rotate(a.rot);
        ctx.beginPath();
        for (let i = 0; i < a.verts; i++) {
          const ang = (i / a.verts) * Math.PI * 2;
          const rad = a.r * a.offsets[i];
          const px = Math.cos(ang) * rad;
          const py = Math.sin(ang) * rad;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      });

      // Draw Particles
      ctx.fillStyle = '#f8fafc';
      particles.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 2, 2);
      });
      ctx.globalAlpha = 1;

      if (isGameOver) {
        ctx.fillStyle = 'rgba(2, 6, 23, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 24px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('CRITICAL INTEGRITY FAILURE', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '14px system-ui';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Press R or Restart to Re-engage', canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      if (e.code === 'Space') {
        e.preventDefault();
        shoot();
      } else if (e.key === 'r' || e.key === 'R') {
        resetGame();
      }
    });

    window.addEventListener('keyup', e => { keys[e.key] = false; });
    restartBtn.addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(update);
  </script>
</body>
</html>
