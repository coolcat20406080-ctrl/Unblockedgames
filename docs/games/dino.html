<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dino Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 12px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 540px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 700;
    }
    .badge {
      background: #1e293b;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    canvas {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      max-width: 100%;
      cursor: pointer;
      touch-action: none;
    }
    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="badge">SCORE: <span id="score" style="color:#10b981;">00000</span></div>
    <div class="badge">HIGH: <span id="high">00000</span></div>
  </div>

  <canvas id="game" width="540" height="240"></canvas>
  <div class="hint">Press Space or Up to Jump · Down to Duck · Tap on Screen</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high');

    let dino = { x: 50, y: 170, w: 28, h: 36, vy: 0, jumping: false, ducking: false };
    const GRAV = 0.58;
    const JUMP_FORCE = -11.5;
    const GROUND_Y = 170;

    let obstacles = [];
    let clouds = [];
    let score = 0;
    let high = parseInt(localStorage.getItem('dino_high') || '0', 10);
    highEl.textContent = String(high).padStart(5, '0');
    let speed = 5;
    let isGameOver = false;
    let frame = 0;

    const audio = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, dur=0.06, type='square') {
      if (audio.state === 'suspended') audio.resume();
      try {
        const o = audio.createOscillator();
        const g = audio.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, audio.currentTime);
        g.gain.setValueAtTime(0.04, audio.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
        o.connect(g);
        g.connect(audio.destination);
        o.start();
        o.stop(audio.currentTime + dur);
      } catch(e) {}
    }

    function reset() {
      dino.y = GROUND_Y;
      dino.vy = 0;
      dino.jumping = false;
      dino.ducking = false;
      obstacles = [];
      score = 0;
      speed = 5;
      frame = 0;
      isGameOver = false;
    }

    function jump() {
      if (isGameOver) {
        reset();
        return;
      }
      if (!dino.jumping) {
        dino.vy = JUMP_FORCE;
        dino.jumping = true;
        beep(500, 0.08);
      }
    }

    function spawnObstacle() {
      const type = Math.random() > 0.4 ? 'cactus' : 'bird';
      if (type === 'cactus') {
        const h = 26 + Math.random() * 18;
        obstacles.push({
          x: canvas.width + 20,
          y: GROUND_Y + 36 - h,
          w: 16 + Math.random() * 14,
          h,
          type: 'cactus'
        });
      } else {
        const flyY = Math.random() > 0.5 ? GROUND_Y - 20 : GROUND_Y + 5;
        obstacles.push({
          x: canvas.width + 20,
          y: flyY,
          w: 24,
          h: 18,
          type: 'bird'
        });
      }
    }

    function update() {
      frame++;

      if (!isGameOver) {
        // Dino physics
        if (dino.jumping) {
          dino.vy += GRAV;
          dino.y += dino.vy;
          if (dino.y >= GROUND_Y) {
            dino.y = GROUND_Y;
            dino.vy = 0;
            dino.jumping = false;
          }
        }

        dino.h = dino.ducking && !dino.jumping ? 20 : 36;
        dino.y = dino.ducking && !dino.jumping ? GROUND_Y + 16 : (dino.jumping ? dino.y : GROUND_Y);

        // Score & Speed
        if (frame % 5 === 0) {
          score++;
          scoreEl.textContent = String(score).padStart(5, '0');
          if (score > high) {
            high = score;
            highEl.textContent = String(high).padStart(5, '0');
            localStorage.setItem('dino_high', high);
          }
          if (score % 100 === 0) {
            beep(784, 0.1, 'triangle');
            speed = Math.min(12, speed + 0.5);
          }
        }

        // Spawn obstacles
        if (frame % Math.max(50, Math.floor(110 - speed * 4)) === 0 && Math.random() > 0.25) {
          spawnObstacle();
        }

        // Clouds
        if (frame % 120 === 0) {
          clouds.push({ x: canvas.width, y: 30 + Math.random() * 50, speed: 1 + Math.random() });
        }
        clouds.forEach(c => { c.x -= c.speed; });
        clouds = clouds.filter(c => c.x > -60);

        // Obstacles
        obstacles.forEach(o => {
          o.x -= speed;

          // Hit detection
          const dBox = { x: dino.x + 4, y: dino.y + 2, w: dino.w - 8, h: dino.h - 4 };
          if (
            dBox.x < o.x + o.w &&
            dBox.x + dBox.w > o.x &&
            dBox.y < o.y + o.h &&
            dBox.y + dBox.h > o.y
          ) {
            isGameOver = true;
            beep(160, 0.25, 'sawtooth');
          }
        });
        obstacles = obstacles.filter(o => o.x > -50);
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#334155';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 14, 0, Math.PI * 2);
        ctx.arc(c.x + 12, c.y - 4, 16, 0, Math.PI * 2);
        ctx.arc(c.x + 24, c.y, 14, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground Line
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y + 36);
      ctx.lineTo(canvas.width, GROUND_Y + 36);
      ctx.stroke();

      // Ground texture dashes
      ctx.fillStyle = '#334155';
      for (let i = 0; i < 15; i++) {
        const gx = ((i * 45) - (frame * speed) % 45 + canvas.width) % canvas.width;
        ctx.fillRect(gx, GROUND_Y + 39, 12, 2);
      }

      // Draw Dino
      ctx.fillStyle = '#10b981';
      ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
      // Eye
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(dino.x + (dino.ducking ? 18 : 16), dino.y + 4, 4, 4);

      // Draw Obstacles
      obstacles.forEach(o => {
        if (o.type === 'cactus') {
          ctx.fillStyle = '#ef4444';
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.fillRect(o.x - 3, o.y + 6, o.w + 6, 6);
        } else {
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(o.x, o.y, o.w, o.h);
          ctx.beginPath();
          ctx.moveTo(o.x, o.y + o.h / 2);
          ctx.lineTo(o.x - 8, o.y + (Math.sin(frame * 0.3) > 0 ? -6 : 10));
          ctx.lineTo(o.x + 8, o.y + o.h / 2);
          ctx.fill();
        }
      });

      if (isGameOver) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ef4444';
        ctx.font = 'bold 22px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText('EXTINCTION LEVEL EVENT', canvas.width / 2, 100);
        ctx.font = '14px system-ui';
        ctx.fillStyle = '#94a3b8';
        ctx.fillText('Tap or Press Space to Restart', canvas.width / 2, 135);
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'w') {
        e.preventDefault();
        jump();
      } else if (e.key === 'ArrowDown' || e.key === 's') {
        dino.ducking = true;
      }
    });

    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowDown' || e.key === 's') {
        dino.ducking = false;
      }
    });

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      jump();
    });

    requestAnimationFrame(update);
  </script>
</body>
</html>
